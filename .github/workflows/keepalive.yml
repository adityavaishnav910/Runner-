name: keepalive
# Public repo par koi commit 60 din na ho to scheduled workflows apne aap band ho
# jaate hain. Ye mahine me ek baar khud hi ek chhota commit karke zinda rakhta hai.
on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > .keepalive
          git config user.name "keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" || exit 0
          git push
